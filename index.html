 if(c){pl.dr=c;pl.g.visible=false;if(c.ai){c.ai=0;c.cap=0;st.wanted=M.max(st.wanted,1);wt_=25;st.rep-=3;toast('Roubaste um veículo! A polícia vem aí')}}}
/* HUD */
const BN=[['Fome','#ff9a2e'],['Sede','#3aa0ff'],['Energia','#ffd23f'],['Saúde','#ff4d5e'],['Comb.','#9be15d'],['Carro','#bbb']];

const BE=[...document.querySelectorAll('.b')],BS=[...document.querySelectorAll('.b s')];
const OB=[['Trabalhar 3 vezes',()=>st.jobs>=3],['Comer e beber',()=>st.ate&&st.drank],['Conduzir 1 km',()=>st.km>=1],['Juntar 10 000 Kz',()=>st.money>=10000]];
const mc=$('mm'),mx=mc.getContext('2d');mc.width=mc.height=220;
function mini(){const s=pl.dr||pl,sc=.9;mx.clearRect(0,0,220,220);mx.save();mx.translate(110,110);mx.beginPath();mx.arc(0,0,108,0,6.3);mx.clip();mx.fillStyle='#2a2d33';mx.fillRect(-110,-110,220,220);mx.fillStyle='#6b6f78';
 for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++)mx.fillRect((i*P-20-s.x)*sc,(j*P-20-s.z)*sc,40*sc,40*sc);
 for(const m of MK){mx.fillStyle='#'+m.c.toString(16).padStart(6,'0');mx.beginPath();mx.arc((m.x-s.x)*sc,(m.z-s.z)*sc,5,0,6.3);mx.fill()}
 for(const v of cops()){mx.fillStyle=M.floor(performance.now()/300)%2?'#f33':'#36f';mx.beginPath();mx.arc((v.x-s.x)*sc,(v.z-s.z)*sc,5,0,6.3);mx.fill()}
 mx.rotate(-s.h);mx.fillStyle='#fff';mx.beginPath();mx.moveTo(0,9);mx.lineTo(-6,-6);mx.lineTo(6,-6);mx.fill();mx.restore()}
function hud(){const s=pl.dr;BS.forEach((e,i)=>{e.style.width=cl([nd.fome,nd.sede,nd.energia,nd.saude,s?s.fuel:0,s?s.hp:0][i],0,100)+'%'});BE[4].style.display=BE[5].style.display=s?'flex':'none';
 $('kz').textContent=st.money.toLocaleString('pt-PT')+' Kz  ·  Rep '+st.rep+'  '+'★'.repeat(st.wanted)+(rain?'  🌧':'');
 $('clk').textContent=String(M.floor(tod)).padStart(2,'0')+':'+String(M.floor(tod%1*60)).padStart(2,'0');
 $('obj').innerHTML='<b>Missões</b><br>'+OB.map(o=>(o[1]()?'✔ ':'○ ')+o[0]).join('<br>');
 let p='';if(s){const m=MK.find(m=>m.v&&dd(m,s)<14);p=m?'E — '+m.a:'E — Sair do veículo'}else{const m=MK.find(m=>dd(m,pl)<3.5);if(m)p='E — '+m.t+': '+m.a;else if(V.find(o=>o.type!='cop'&&dd(o,pl)<5))p='E — Entrar no veículo'}
 if(msgT<=0)$('msg').textContent=p;mini();
 const k=cl((M.sin((tod-6)/12*M.PI)+.12)/.4,0,1);BM.forEach(m=>m.emissiveIntensity=(1-k)*.9);bulb.color.setHex(k<.6?0xffe9a0:0x777777)}
/* ambiente: ciclo dia/noite e clima */
const NC=new THREE.Color(0x060b1c),DC=new THREE.Color(0x86c8f5),OC=new THREE.Color(0xff8a4a);
function env(dt,s){const a=(tod-6)/12*M.PI,sh=M.sin(a),k=cl((sh+.12)/.4,0,1);sky.copy(NC).lerp(DC,k);if(M.abs(sh)<.25)sky.lerp(OC,(1-M.abs(sh)/.25)*.5);if(rain)sky.multiplyScalar(.65);
 S.fog.color.copy(sky);S.fog.far=rain?140:260;hemi.intensity=(.25+.55*k)*(rain?.8:1);sun.intensity=M.max(0,sh)*(rain?.5:1.1);
 sun.position.set(s.x+M.cos(a)*120,M.max(8,sh*120),s.z+40);sun.target.position.set(s.x,0,s.z);
 rainT-=dt;if(rainT<=0){rain=M.random()<.4?1:0;rainT=rnd(40,90);rn.visible=!!rain}
 if(rain){const p=rg.attributes.position.array;for(let i=1;i<900;i+=3){p[i]-=35*dt;if(p[i]<0)p[i]=30}rg.attributes.position.needsUpdate=true;rn.position.set(C.position.x,0,C.position.z)}}
/* atualização */
function upd(dt){
 tod=(tod+dt/10)%24;msgT-=dt;const v=pl.dr,ix=cl(K.r-K.l+jx,-1,1),iy=cl(K.u-K.d+jy,-1,1),jmp=J;J=0;
 const run=!v&&(K.sh||bR)&&(ix||iy);
 nd.fome-=.3*dt;nd.sede-=.45*dt;nd.energia-=(run?.6:.12)*dt;for(const k of['fome','sede','energia'])nd[k]=M.max(0,nd[k]);
 if(!nd.fome||!nd.sede||!nd.energia)nd.saude-=2*dt;else nd.saude=M.min(100,nd.saude+.3*dt);
 if(nd.saude<=0){toast('Desmaiaste e foste levado para casa');st.money=M.floor(st.money*.7);Object.assign(nd,{fome:50,sede:50,energia:60,saude:60});pl.dr=null;pl.g.visible=true;pl.x=-13;pl.z=10}
 if(A){A=0;act()}
 if(!pl.dr){const l=M.hypot(ix,iy);let sp=0;if(l>.1){const n=l>1?1/l:1,dx=(M.sin(cy)*iy-M.cos(cy)*ix)*n,dz=(M.cos(cy)*iy+M.sin(cy)*ix)*n;sp=(run?7.5:3.8)*(nd.energia<8?.5:1)*M.min(1,l);pl.x+=dx*sp*dt;pl.z+=dz*sp*dt;pl.h+=ad(M.atan2(dx,dz),pl.h)*M.min(1,dt*12)}
  if(pl.y<=0&&jmp)pl.vy=6.5;pl.vy-=18*dt;pl.y+=pl.vy*dt;if(pl.y<0){pl.y=0;pl.vy=0}
  col(pl,.45);pl.g.position.set(pl.x,pl.y,pl.z);pl.g.rotation.y=pl.h;anim(pl.g,sp,dt)}
 else{const q=pl.dr;drive(q,{th:iy,st:ix,br:K.sp},dt);pl.x=q.x;pl.z=q.z;pl.h=q.h;st.km+=M.abs(q.s)*dt/1000;
  for(const o of NP)if(!o.dn&&dd(o,q)<2.3&&M.abs(q.s)>5){o.dn=5;st.wanted=M.min(3,st.wanted+1);wt_=25;st.rep-=5;toast('Atropelaste alguém! A polícia procura-te')}}
 const s=pl.dr||pl,O=pl.dr?V:V.concat([pl]);
 for(const o of V){if(o===pl.dr){}else if(o.ai=='t')traf(o,dt,O);else if(o.ai=='c')chase(o,s,dt);else if(o.s)drive(o,{th:0,br:1,st:0},dt);
  o.g.position.set(o.x,0,o.z);o.g.rotation.y=o.h;if(o.lb)o.lb.material.color.setHex(M.floor(performance.now()/150)%2?0xff2020:0x2060ff)}
 for(const o of NP){if(o.dn>0){o.dn-=dt;o.g.rotation.x=-1.5;o.g.position.y=.25;if(o.dn<=0){o.g.rotation.x=0;o.g.position.y=0}continue}
  o.p+=o.d*o.sp*dt;if(M.abs(o.p)>180)o.d=-o.d;if(o.ax){o.x=o.p;o.z=o.c;o.g.rotation.y=o.d>0?M.PI/2:-M.PI/2}else{o.x=o.c;o.z=o.p;o.g.rotation.y=o.d>0?0:M.PI}
  o.g.position.set(o.x,0,o.z);anim(o.g,o.sp*1.6,dt)}
 wt_-=dt;if(st.wanted>0&&wt_<=0){st.wanted--;wt_=22}
 if(st.wanted>0&&!cops().length){const c=mk('cop',(M.round(rnd(-4,3))+.5)*P+3,cl(s.z+(M.random()<.5?-90:90),-170,170),0,'c')}
 if(!st.wanted&&cops().length)clearCops();
 if(st.wanted>0){const c=cops().find(o=>dd(o,s)<4.5);if(c&&(!pl.dr||M.abs(pl.dr.s)<9)){const f=M.min(st.money,1500);st.money-=f;st.wanted=0;st.rep-=2;if(pl.dr)pl.dr.s=0;pl.dr=null;pl.g.visible=true;pl.x=0;pl.z=8;toast('Foste detido. Multa de '+f+' Kz');clearCops()}}
 env(dt,s)}
/* câmara */
const cT=new THREE.Vector3(),cP=new THREE.Vector3();
function cam(dt){const s=pl.dr||pl,hh=pl.dr?2:1.6,cd=(pl.dr?(pl.dr.type=='van'?12:9):5.5)*zm;dragT-=dt;if(pl.dr&&dragT<=0)cy+=ad(pl.dr.h,cy)*M.min(1,dt*2.5);
 cT.set(s.x,(s.y||0)+hh,s.z);cP.set(cT.x-M.sin(cy)*M.cos(cp)*cd,M.max(.7,cT.y+M.sin(cp)*cd),cT.z-M.cos(cy)*M.cos(cp)*cd);C.position.lerp(cP,M.min(1,dt*12+.02));C.lookAt(cT)}
let last=performance.now(),hT=0;
function frame(n){requestAnimationFrame(frame);const dt=M.min(.05,(n-last)/1e3);last=n;if(playing)upd(dt);cam(dt);hT-=dt;if(hT<=0){hT=.12;hud()}R.render(S,C)}
C.position.set(0,6,0);pl.g.position.set(pl.x,0,pl.z);env(.01,pl);
$('go').onclick=()=>{$('st').style.display='none';playing=1};
setInterval(()=>{try{localStorage.setItem('ah',JSON.stringify({st,nd,tod}))}catch(e){}},8000);
requestAnimationFrame(frame);
